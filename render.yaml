services:
  - type: web
    name: redbridge-finops
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: REDBRIDGE_DATABASE_URL
        sync: false
      - key: REDBRIDGE_ENCRYPTION_KEY
        generateValue: true
      - key: REDBRIDGE_OPENAI_API_KEY
        sync: false
      - key: REDBRIDGE_OPENAI_MODEL
        value: gpt-5.4-mini

